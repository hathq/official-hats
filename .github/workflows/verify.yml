name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install declared toolchain on ephemeral runner
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Verify library and packaged independent consumer
        run: |
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 test --locked --all-targets --all-features
          cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.97.1 package --locked
          consumer=$(mktemp -d)
          mkdir -p "$consumer/src"
          printf '[package]\nname="verifier-consumer"\nversion="0.1.0"\nedition="2024"\n[dependencies]\nofficial-hats={path="%s"}\n' "$PWD/target/package/official-hats-0.11.0" > "$consumer/Cargo.toml"
          printf 'fn main() { assert!(official_hats::verify_index_bytes(b"{}", "", "", "consumer-key").is_err()); }\n' > "$consumer/src/main.rs"
          cargo +1.97.1 run --manifest-path "$consumer/Cargo.toml"
          git diff --exit-code -- .
